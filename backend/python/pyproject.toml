[project]
name = "oneshot-python"
version = "1.0.0"
description = "Python reasoning and analysis addon for OneShot"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "pydantic>=2",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"../schema/reasoning" = "app/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
