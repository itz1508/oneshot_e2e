[project]
name = "oneshot-cosmos-skill"
version = "0.1.0"
description = "OneShot skill wrapper for strands-cosmos (independent uv project)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "strands-cosmos>=0.1.0",
    "strands-agents>=1.17.0",
    "pydantic>=2.10.0",
    # Direct torch pins are required so [tool.uv.sources] can route them to
    # the correct PyTorch index per platform. Without direct deps the source
    # override is silently ignored for transitive packages.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
oneshot-cosmos-skill = "oneshot_cosmos_skill.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is at the project root, not under src/.
module-root = ""

# PyTorch publishes CPU and GPU wheels to separate indexes using local version
# identifiers (e.g., 2.11.0+cpu vs 2.11.0+cu130). Declaring the indexes as
# explicit=true ensures only torch-family packages use them, not unrelated deps.
#
# Markers select the correct wheel per platform:
#   - darwin / win32 -> CPU-only index (no CUDA payload)
#   - linux          -> CUDA 13.0 index (matches PyPI's default Linux wheel)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
