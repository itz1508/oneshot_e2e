name: oneshot_e2e
services:
  redis:
    image: redis:7-alpine
    container_name: oneshot-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - oneshot_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: oneshot-server
    command:
      - node
      - dist/backend/index.js
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      REDIS_URL: redis://redis:6379
      ONESHOT_MODE: sample
      PYTHON_REASONER_URL: http://reasoner:8000
      ONESHOT_RUNTIME_DIR: /app/.runtime
    volumes:
      - oneshot_runtime:/app/.runtime
    depends_on:
      redis:
        condition: service_healthy
      reasoner:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: oneshot-worker
    command:
      - node
      - dist/backend/scripts/run-pipeline-worker.js
    environment:
      REDIS_URL: redis://redis:6379
      ONESHOT_MODE: sample
      PYTHON_REASONER_URL: http://reasoner:8000
      ONESHOT_RUNTIME_DIR: /app/.runtime
    volumes:
      - oneshot_runtime:/app/.runtime
    depends_on:
      - redis
      - reasoner

  reasoner:
    build:
      context: ..
      dockerfile: backend/python/Dockerfile
    container_name: oneshot-python-reasoner
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - redis

volumes:
  oneshot_redis_data:
  oneshot_runtime:
