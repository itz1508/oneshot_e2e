[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneshot"
version = "1.3.0"
description = "Deterministic AI code generation and verification platform with Google ADK 2.0 graph workflow, RFC 8785 canonicalization, and SHA-256 cryptographic proofs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "OneShot Development Team" }
]
keywords = [
    "ai",
    "agentic-coding",
    "google-adk",
    "workflow-graph",
    "rfc8785",
    "cryptographic-proofs",
    "deterministic-validation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]

# Core: Required Deterministic Python Runtime
dependencies = [
    "annotated-types==0.7.0",
    "attrs==26.1.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "referencing==0.37.0",
    "rpds-py==2026.5.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
]

[project.optional-dependencies]
# Optional Python ADK Research Worker
provider-adk = [
    "google-adk==2.8.0",
    "litellm==1.98.0",
    "redis==8.1.0",
]

# Optional Featherless Worker
provider-featherless = [
    "openai==2.54.0",
]

# Optional Standalone FastAPI Service
workspace-api = [
    "anthropic==1.2.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "google-genai==2.20.0",
    "httpx==0.28.1",
    "openai==2.54.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pwdlib==0.3.1",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
]

all = [
    "oneshot[provider-adk,provider-featherless,workspace-api]",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["validation", "workspace_api", "scripts", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "dist", "data"]
strict = ["validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
