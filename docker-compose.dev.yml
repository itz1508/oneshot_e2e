services:
  redis:
    image: redis:7-alpine
    container_name: oneshot-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "6379:6379"

    volumes:
      - oneshot_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: oneshot-server
    command:
      - node
      - dist/backend/index.js
    ports:
      - "8787:8787"
    environment:
      REDIS_URL: redis://redis:6379
      ONESHOT_MODE: sample
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: oneshot-worker
    command:
      - node
      - dist/backend/scripts/run-pipeline-worker.js
    environment:
      REDIS_URL: redis://redis:6379
      ONESHOT_MODE: sample
    depends_on:
      - redis

volumes:
  oneshot_redis_data:
