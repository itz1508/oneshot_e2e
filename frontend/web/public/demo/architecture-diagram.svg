<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0d0d11;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="50%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="50%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" fill="none" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Title & Header -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="10" height="32" rx="3" fill="url(#geminiGrad)" filter="url(#glow)"/>
    <text x="24" y="24" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="-0.5">OneShot E2E — System Architecture</text>
    <text x="500" y="23" fill="#8ab4f8" font-size="12" font-family="'JetBrains Mono',monospace" font-weight="600" letter-spacing="1">GOOGLE GEMINI 3.5 · AGENT DEVELOPMENT KIT (ADK) · GOOGLE CLOUD RUN</text>
  </g>

  <!-- ==================== LAYER 1: CLIENT / FRONTEND ==================== -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="135" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="135" rx="3" fill="#3b82f6"/>
    <text x="24" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.5" text-transform="uppercase">Layer 1: Canonical Web UI &amp; Streaming Client (Next.js 16 App Router)</text>

    <!-- Component 1: Chat Shell & Projections -->
    <g transform="translate(24, 42)">
      <rect width="320" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="14" font-weight="600">DeepAgents React Projections</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">stream.messages · stream.subagents</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">stream.tool_calls · stream.values.todos</text>
    </g>

    <!-- Component 2: Action API v2 Client -->
    <g transform="translate(364, 42)">
      <rect width="330" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="14" font-weight="600">Action API v2 Client</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">OneShotPublicApi &amp; SecurityWorker</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">Strict Server-Side Credential Boundary</text>
    </g>

    <!-- Component 3: Task Rail & Verification Panel -->
    <g transform="translate(714, 42)">
      <rect width="342" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="14" font-weight="600">Task Management Rail</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Human Review Gates (Gate 1 &amp; Gate 2)</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">Proof Ledger: Expected == Observed</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="220" y1="235" x2="220" y2="270"/>
    <line x1="530" y1="235" x2="530" y2="270"/>
    <line x1="880" y1="235" x2="880" y2="270"/>
  </g>
  <text x="540" y="258" fill="#60a5fa" font-size="10" font-family="'JetBrains Mono',monospace">Real-time SSE (/api/agent/stream) &amp; HTTP POST (/api/v2/*)</text>

  <!-- ==================== LAYER 2: BACKEND RUNTIME ==================== -->
  <g transform="translate(60, 270)">
    <rect width="1080" height="195" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="195" rx="3" fill="#10b981"/>
    <text x="24" y="28" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5" text-transform="uppercase">Layer 2: OneShot Runtime &amp; Google ADK Workflow Engine</text>

    <!-- Box 1: Multi-Agent Coordinator -->
    <g transform="translate(24, 44)">
      <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Multi-Agent SOPs</text>
      <text x="16" y="44" fill="#34d399" font-size="11" font-weight="500">• Researcher Agent</text>
      <text x="16" y="62" fill="#34d399" font-size="11" font-weight="500">• Planner Agent</text>
      <text x="16" y="80" fill="#34d399" font-size="11" font-weight="500">• Builder Agent</text>
      <text x="16" y="98" fill="#34d399" font-size="11" font-weight="500">• Refactor &amp; Critic</text>
      <text x="16" y="118" fill="#64748b" font-size="10">Private scoped tool bindings</text>
    </g>

    <!-- Box 2: Google ADK Engine & Transitions -->
    <g transform="translate(290, 44)">
      <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Google ADK Workflow</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Transition State Machine</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11">Stage Scope Isolation</text>
      <text x="16" y="80" fill="#94a3b8" font-size="11">Gate 1: Research Review</text>
      <text x="16" y="98" fill="#94a3b8" font-size="11">Gate 2: Package Core Hash</text>
      <text x="16" y="118" fill="#64748b" font-size="10">backend/workflow/adk</text>
    </g>

    <!-- Box 3: Deterministic Reasoner -->
    <g transform="translate(556, 44)">
      <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Python Reasoner</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Offline Local Reasoning</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11">Deterministic RPC &amp; Subprocess</text>
      <text x="16" y="80" fill="#94a3b8" font-size="11">Fixture SHA-256 Hashing</text>
      <text x="16" y="98" fill="#94a3b8" font-size="11">Contract Canonicalization</text>
      <text x="16" y="118" fill="#64748b" font-size="10">backend/python/app/main.py</text>
    </g>

    <!-- Box 4: SessionLedger & Storage -->
    <g transform="translate(822, 44)">
      <rect width="234" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">State &amp; Memory Bank</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">SessionLedger Checkpoints</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11">Virtual Filesystem Sandbox</text>
      <text x="16" y="80" fill="#94a3b8" font-size="11">Git &amp; Byte-Exact Storage</text>
      <text x="16" y="98" fill="#94a3b8" font-size="11">Audit Trail &amp; Telemetry</text>
      <text x="16" y="118" fill="#64748b" font-size="10">packages/agent-runtime/storage</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <g stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="220" y1="465" x2="220" y2="505"/>
    <line x1="530" y1="465" x2="530" y2="505"/>
    <line x1="880" y1="465" x2="880" y2="505"/>
  </g>
  <text x="490" y="490" fill="#34d399" font-size="10" font-family="'JetBrains Mono',monospace">Google GenAI SDK · Vertex AI · Google Cloud Infrastructure</text>

  <!-- ==================== LAYER 3: INFRASTRUCTURE ==================== -->
  <g transform="translate(60, 505)">
    <rect width="1080" height="135" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="135" rx="3" fill="#8b5cf6"/>
    <text x="24" y="28" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.5" text-transform="uppercase">Layer 3: Google Cloud &amp; Foundation Models (Gemini Enterprise Platform)</text>

    <!-- Infra 1: Gemini 3.5 Flash & Vertex AI -->
    <g transform="translate(24, 42)">
      <rect width="320" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#8ab4f8" font-size="14" font-weight="600">Google Gemini 3.5 &amp; Vertex AI</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Fast Multi-modal Flash Reasoning</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">Resilient Gateway Fallbacks (OpenAI, Mistral)</text>
    </g>

    <!-- Infra 2: Google Cloud Run -->
    <g transform="translate(364, 42)">
      <rect width="330" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#8ab4f8" font-size="14" font-weight="600">Google Cloud Run (Serverless)</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Containerized Deployment (docker/Dockerfile)</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">Asynchronous Long-Running Task Workers</text>
    </g>

    <!-- Infra 3: Observability & Security -->
    <g transform="translate(714, 42)">
      <rect width="342" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#8ab4f8" font-size="14" font-weight="600">Observability &amp; Guardrails</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">OpenTelemetry / Cloud Logging Traces</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">Zero-Trust Credential Isolation &amp; Model Armor</text>
    </g>
  </g>
</svg>
