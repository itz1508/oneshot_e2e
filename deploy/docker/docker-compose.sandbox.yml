version: "3.8"

# OneShot External Sandbox Deployment Baseline
# HARDENED SECURITY BASELINE:
# - non-root execution
# - read-only root filesystem
# - no new privileges
# - drop all Linux capabilities
# - strict PID/Memory/CPU limits
# - isolated network (none)
# - tmpfs for temporary workspace only
# - no docker socket or host bind mounts

services:
  sandbox-worker:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.sandbox
    image: ${ONESHOT_SANDBOX_IMAGE:-oneshot-sandbox-worker:latest}
    user: "${SANDBOX_UID:-10001}:${SANDBOX_GID:-10001}"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: ${SANDBOX_PID_LIMIT:-64}

    mem_limit: ${SANDBOX_MEMORY_LIMIT:-512m}
    cpus: ${SANDBOX_CPU_LIMIT:-1.0}

    network_mode: none

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /work:rw,size=256m

    environment:
      - NODE_ENV=production
      - ONESHOT_SANDBOX_ISOLATED=true
      - ONESHOT_NETWORK_POLICY=DENY_ALL

    restart: unless-stopped
