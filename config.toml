[app]
name = "OneShot Agent Runtime"
version = "1.3.0"
environment = "production"

[server]
host = "0.0.0.0"
port = 8787
request_max_bytes = 10485760
body_timeout_ms = 30000

# Keep existing behavior.
# Restrict later if deployment requirements change.
cors_allowed_origins = ["*"]

[security]

[security.rate_limiting]
enabled = true
max_requests_per_minute = 120
burst_limit = 30
window_seconds = 60

[security.auth]
enabled = false
api_key_env = "ONESHOT_API_TOKEN"
headerName = "authorization"

[security.headers]
enabled = true
contentSecurityPolicy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
xContentTypeOptions = "nosniff"
xFrameOptions = "DENY"
strict_transport_security = "max-age=31536000; includeSubDomains"

[sandbox]
virtual_mode = true
max_file_size_bytes = 52428800

partitions = [
    { name = "workspace", path = "/workspace", description = "Physical repository root; durable read/write source code" },
    { name = "scratch", path = "/scratch", description = "Ephemeral RAM/scratchpad partition for intermediate dumps" },
    { name = "memories", path = "/memories", description = "Persistent cross-turn memory bank; decoupled from git" },
    { name = "artifacts", path = "/artifacts", description = "Immutable deliverable staging; verified by SHA-256 byte digest" }
]

[models]
default_provider = "mistral"

[models.roles]
reasoning = "ministral-8b-latest"
fast = "gemini-2.5-flash"
coding = "codestral-latest"
critic = "ministral-8b-latest"
vision = "gemini-2.5-flash"
local = "llama3.2"

[[models.providers]]
name = "mistral"
priority = 100
baseUrl = "https://api.mistral.ai/v1"
defaultModel = "ministral-8b-latest"
models = [
    "ministral-8b-latest",
    "codestral-latest",
    "open-mistral-nemo",
    "ministral-3b-latest",
    "open-mistral-7b",
    "pixtral-12b-2409",
    "mistral-large-latest",
    "mistral-small-latest",
    "mistral-medium-latest"
]
envKey = "MISTRAL_API_KEY"
explicit = false
fallback = "gemini"

[[models.providers]]
name = "gemini"
priority = 90
baseUrl = "https://generativelanguage.googleapis.com/v1beta/openai/"
defaultModel = "gemini-2.5-flash"
models = [
    "gemini-2.5-flash",
    "gemini-2.5-pro"
]
envKey = "GEMINI_API_KEY"
explicit = false
fallback = "openai"

[[models.providers]]
name = "openai"
priority = 80
baseUrl = "https://api.openai.com/v1"
defaultModel = "gpt-4o-mini"
models = [
    "gpt-4o",
    "gpt-4o-mini",
    "gpt-5",
    "gpt-5-mini"
]
envKey = "OPENAI_API_KEY"
explicit = false
fallback = "nebius"

[[models.providers]]
name = "nebius"
priority = 70
baseUrl = "https://api.studio.nebius.com/v1/"
defaultModel = "moonshotai/Kimi-K2.5"
models = [
    "moonshotai/Kimi-K2.5",
    "deepseek-ai/DeepSeek-R1-0528"
]
envKey = "NEBIUS_API_KEY"
explicit = false
fallback = "ollama"

[[models.providers]]
name = "ollama"
priority = 50
baseUrl = "http://localhost:11434/v1"
defaultModel = "llama3.2"
models = [
    "llama3.2",
    "mistral",
    "deepseek-r1",
    "phi3"
]
envKey = "OLLAMA_API_KEY"
explicit = true
