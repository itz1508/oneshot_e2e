name: Temporary ADK Role Node Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-adk-researcher-node-test.yml'
      - 'backend/**'
      - 'backend/tests/ts/**'
      - 'app/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/requirements/**'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  dynamic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up npm 11.8
        run: npm install --global npm@11.8.0 --no-audit --no-fund
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements/base.txt
      - name: Build backend and tests
        run: npm run build:backend
      - name: Run all backend TypeScript tests
        run: node --test --test-force-exit dist/backend/tests/ts/*.test.js

# scope: dynamic production runtime integration + complete backend TypeScript suite + full session response evidence
