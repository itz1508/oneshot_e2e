name: Canonical Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-adk-researcher-node-test.yml'
      - 'backend/**'
      - 'backend/tests/ts/**'
      - 'app/fixtures/**'
      - 'app/web/**'
      - 'app/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/requirements/**'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  dynamic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up npm 11.8
        run: npm install --global npm@11.8.0 --no-audit --no-fund
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install web dependencies
        run: npm --prefix app/web ci --ignore-scripts --no-audit --no-fund
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements/base.txt -r app/requirements/workspace-api.txt
      - name: Build backend, tests, and web UI
        run: |
          npm run build:backend
          npm --prefix app/web run build
      - name: Run all backend TypeScript tests
        run: npm run verify
      - name: Frontend tests
        run: npm --prefix app/web test
      - name: Verify committed source manifest
        run: python app/scripts/verify_manifest.py

# scope: dynamic production runtime integration + complete backend TypeScript suite + full session response evidence
