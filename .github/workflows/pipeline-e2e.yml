name: Pipeline E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pipeline-happy-path:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - name: Install
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Build tests
        run: npm run build:test

      - name: Build application
        run: |
          npm --prefix app/web ci
          npm run build

      - name: Start OneShot server
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Start OneShot worker
        run: |
          node dist/backend/scripts/run-pipeline-worker.js > /tmp/oneshot-worker.log 2>&1 &
          echo $! > /tmp/oneshot-worker.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oneshot.log
          cat /tmp/oneshot-worker.log
          exit 1

      - name: Happy-path pipeline
        run: npm run test:pipeline:e2e

      - name: Print server logs on failure
        if: failure()
        run: |
          cat /tmp/oneshot.log || true
          cat /tmp/oneshot-worker.log || true

  pipeline-planner-retry:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample
      PIPELINE_FAULTS_ENABLED: "true"
      PIPELINE_FAULT_STAGE: planner
      PIPELINE_FAULT_MODE: fail-once

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - run: npm ci

      - run: npm run build:backend

      - name: Start server
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Start worker
        run: |
          node dist/backend/scripts/run-pipeline-worker.js > /tmp/oneshot-worker.log 2>&1 &
          echo $! > /tmp/oneshot-worker.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat /tmp/oneshot.log
          cat /tmp/oneshot-worker.log
          exit 1

      - name: Verify retry
        run: npm run test:pipeline:e2e

      - if: failure()
        run: |
          cat /tmp/oneshot.log || true
          cat /tmp/oneshot-worker.log || true

  pipeline-validation-block:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample
      PIPELINE_FAULTS_ENABLED: "true"
      PIPELINE_FAULT_STAGE: triple-validation
      PIPELINE_FAULT_MODE: fail-always

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - run: npm ci

      - run: npm run build:backend

      - name: Start server
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Start worker
        run: |
          node dist/backend/scripts/run-pipeline-worker.js > /tmp/oneshot-worker.log 2>&1 &
          echo $! > /tmp/oneshot-worker.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat /tmp/oneshot.log
          cat /tmp/oneshot-worker.log
          exit 1

      - name: Verify build blocking
        run: npm run test:pipeline:e2e

      - if: failure()
        run: |
          cat /tmp/oneshot.log || true
          cat /tmp/oneshot-worker.log || true

  pipeline-worker-recovery:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample
      # The recovery scripts poll /api/runs/:id/history every 500ms (2 requests
      # per poll), far exceeding the product default of 100 requests/15min.
      API_RATE_LIMIT_MAX: "100000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - run: npm ci

      - run: npm run build:backend

      - name: Start server
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat /tmp/oneshot.log
          exit 1

      - name: Verify worker crash recovery
        run: node backend/scripts/test-pipeline-recovery.mjs

      - if: failure()
        run: |
          cat /tmp/oneshot.log || true


  pipeline-checkpoint-recovery:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample
      PIPELINE_FAULTS_ENABLED: "true"
      PIPELINE_FAULT_STAGE: evaluation
      PIPELINE_FAULT_MODE: crash-after-checkpoint
      # Recovery scripts poll history every 500ms; lift the API rate limit for CI.
      API_RATE_LIMIT_MAX: "100000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - run: npm ci

      - run: npm run build:backend

      - name: Start server (never restarted by the test)
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat /tmp/oneshot.log
          exit 1

      - name: Verify checkpoint recovery after crash-after-checkpoint
        run: npm run test:pipeline:checkpoint-recovery

      - if: failure()
        run: |
          cat /tmp/oneshot.log || true

  pipeline-refinement-recovery:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      ONESHOT_MODE: sample
      PIPELINE_FAULTS_ENABLED: "true"
      PIPELINE_FAULTS: '[{"stage":"triple-validation","mode":"refine-once"},{"stage":"evaluation","mode":"crash-after-checkpoint","minIteration":1}]'
      # Recovery scripts poll history every 500ms; lift the API rate limit for CI.
      API_RATE_LIMIT_MAX: "100000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        run: python -m pip install -r app/requirements/base.txt

      - run: npm ci

      - run: npm run build:backend

      - name: Start server (never restarted by the test)
        run: |
          npm start > /tmp/oneshot.log 2>&1 &
          echo $! > /tmp/oneshot.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat /tmp/oneshot.log
          exit 1

      - name: Verify refinement iteration crash recovery
        run: npm run test:pipeline:refinement-recovery

      - if: failure()
        run: |
          cat /tmp/oneshot.log || true


  python-reasoner-tests:
    runs-on: ubuntu-latest

    env:
      ONESHOT_INTERNAL_TOKEN: test-internal-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reasoner
        run: |
          cd backend/python
          pip install -e ".[dev]"

      - name: Run Python tests
        run: |
          cd backend/python
          pytest
