name: Tavily Researcher Verify

on:
  push:
    branches: [feature/tavily-researcher-evidence]
    paths:
      - '.github/workflows/tavily-researcher-verify.yml'
      - 'backend/role/researcher/**'
      - 'backend/python-runtime.ts'
      - 'tests_ts/tavily-researcher-evidence.test.ts'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'backend/role/researcher/**'
      - 'backend/python-runtime.ts'
      - 'tests_ts/tavily-researcher-evidence.test.ts'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up npm 11.8
        run: npm install --global npm@11.8.0 --no-audit --no-fund

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile backend and TypeScript tests
        run: npm run build:backend

      - name: Run deterministic Tavily Researcher tests
        run: node --test --test-force-exit dist/tests_ts/tavily-researcher-evidence.test.js
