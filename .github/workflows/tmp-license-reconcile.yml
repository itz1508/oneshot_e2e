name: OneShot Apache-2.0 License Reconciliation

on:
  push:
    branches: [handoff-native-gemini-e2e-20260902]
    paths:
      - '.github/workflows/tmp-license-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile-license:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reconciliation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard authoritative ancestry
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITATIVE_BASE='78fccdcf8ae41d97a7b817bd9c92094ab7d4ebeb'
          git merge-base --is-ancestor "$AUTHORITATIVE_BASE" HEAD
          echo "LICENSE_RECONCILIATION_HEAD=$(git rev-parse HEAD)"
          echo "LICENSE_RECONCILIATION_BASE=$AUTHORITATIVE_BASE"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDF verification tooling
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0

      - name: Apply approved Apache-2.0 reconciliation
        run: python scripts/tmp_reconcile_license.py

      - name: Keep workflow finalization outside Actions token scope
        run: git checkout -- .github/workflows/tmp-adk-live-real-e2e.yml

      - name: Regenerate submission workflow PDF
        run: python scripts/generate_workflow_pdf.py

      - name: Remove one-shot staging helper from artifact commit
        run: git rm scripts/tmp_reconcile_license.py

      - name: Run dedicated license audit
        run: python scripts/verify_license.py

      - name: Verify tracked submission PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pypdf import PdfReader

          bad = (
              'UN' + 'LICENSED',
              'OneShot ' + 'Evaluator License',
              'CONFIDENTIAL & ' + ('PRO' + 'PRIETARY'),
              'evaluation ' + 'only',
          )
          for rel in ('docs/Workflow_Processing.pdf', 'docs/WORKFLOW_TREE.pdf'):
              reader = PdfReader(rel)
              text = '\n'.join((page.extract_text() or '') for page in reader.pages)
              found = [phrase for phrase in bad if phrase.lower() in text.lower()]
              if found:
                  raise SystemExit(f'PDF_LICENSE_GATE=ROOT_CAUSE file={rel} conflicts={found}')
              if 'apache license 2.0' not in text.lower():
                  raise SystemExit(f'PDF_LICENSE_GATE=ROOT_CAUSE file={rel} missing Apache License 2.0 text')
              print(f'PDF_LICENSE_SCAN file={rel} pages={len(reader.pages)} result=PASSED')
          print('PDF_LICENSE_GATE=PASSED')
          PY

      - name: Regenerate manifest twice and prove stability
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_manifest.py
          cp MANIFEST.sha256 /tmp/MANIFEST.first.sha256
          FIRST_COUNT="$(wc -l < MANIFEST.sha256 | tr -d ' ')"
          python scripts/generate_manifest.py
          cmp --silent /tmp/MANIFEST.first.sha256 MANIFEST.sha256
          SECOND_COUNT="$(wc -l < MANIFEST.sha256 | tr -d ' ')"
          test "$FIRST_COUNT" = "$SECOND_COUNT"
          echo "MANIFEST_GENERATED entries=$FIRST_COUNT"
          echo "MANIFEST_SECOND_GENERATION_NO_DIFF=true"

      - name: Final reconciliation gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- . ':(exclude)docs/Workflow_Processing.pdf'
          python scripts/verify_license.py
          echo 'LICENSE_CHANGED_FILES_BEGIN'
          git status --short
          echo 'LICENSE_CHANGED_FILES_END'

      - name: Commit reconciled non-workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: release hackathon artifacts under Apache-2.0'
          echo "LICENSE_ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:handoff-native-gemini-e2e-20260902
