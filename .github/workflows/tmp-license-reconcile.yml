name: OneShot Apache-2.0 Final Manifest Preparation

on:
  push:
    branches: [handoff-native-gemini-e2e-20260902]
    paths:
      - '.github/workflows/tmp-license-reconcile.yml'

permissions:
  contents: write

jobs:
  prepare-final-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard reconciled artifact ancestry
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_COMMIT='bc0e436db4c50be588f1e5d54215b924f33e92c9'
          git merge-base --is-ancestor "$ARTIFACT_COMMIT" HEAD
          echo "FINAL_MANIFEST_STAGING_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_MANIFEST_ARTIFACT_BASE=$ARTIFACT_COMMIT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Project exact future final workflow tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-adk-live-real-e2e.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Verify canonical contracts and manifest
        run: npm run verify
'''
          new = '''      - name: Verify canonical contracts, Apache-2.0 license, and manifest
        run: |
          npm run verify
          python scripts/verify_license.py
          python scripts/generate_manifest.py
          git diff --exit-code -- MANIFEST.sha256
          python scripts/generate_manifest.py
          git diff --exit-code -- MANIFEST.sha256
'''
          assert text.count(old) == 1, 'permanent E2E verification block drifted'
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/tmp-license-reconcile.yml

      - name: Generate final manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_manifest.py
          cp MANIFEST.sha256 /tmp/MANIFEST.first.sha256
          python scripts/generate_manifest.py
          cmp --silent /tmp/MANIFEST.first.sha256 MANIFEST.sha256
          ENTRIES="$(wc -l < MANIFEST.sha256 | tr -d ' ')"
          test "$ENTRIES" = '483'
          ! grep -q '  .github/workflows/tmp-license-reconcile.yml$' MANIFEST.sha256
          EXPECTED_WORKFLOW_SHA="$(sha256sum .github/workflows/tmp-adk-live-real-e2e.yml | awk '{print $1}')"
          ACTUAL_WORKFLOW_SHA="$(awk '$2 == ".github/workflows/tmp-adk-live-real-e2e.yml" {print $1}' MANIFEST.sha256)"
          test "$EXPECTED_WORKFLOW_SHA" = "$ACTUAL_WORKFLOW_SHA"
          python scripts/verify_license.py
          echo "FINAL_MANIFEST_ENTRIES=$ENTRIES"
          echo "FINAL_MANIFEST_SECOND_GENERATION_NO_DIFF=true"
          echo "FINAL_WORKFLOW_SHA256=$EXPECTED_WORKFLOW_SHA"

      - name: Store final manifest as unreferenced Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT_B64="$(base64 -w0 MANIFEST.sha256)"
          BLOB_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$CONTENT_B64" -f encoding='base64' --jq '.sha')"
          test -n "$BLOB_SHA"
          echo "FINAL_MANIFEST_BLOB_SHA=$BLOB_SHA"
          echo "FINAL_MANIFEST_BLOB_READY=true"
