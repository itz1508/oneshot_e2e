name: Temporary AI SDK Provider Install

on:
  push:
    branches:
      - chore/install-ai-sdk-providers

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.8.0

      - name: Install official AI SDK provider packages
        run: npm install --save ai @ai-sdk/anthropic @ai-sdk/openai @ai-sdk/google

      - name: Verify clean install
        run: npm ci

      - name: Verify backend TypeScript build
        run: npm run build:backend

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: install official AI SDK provider packages"
          git push
