name: Provider Boundary Migration

on:
  push:
    branches:
      - fix/provider-researcher-boundary

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-researcher-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm

      - name: Correct compile gaps without restoring ResearchProvider
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # Source compile corrections.
          edit('backend/agents/researcher/bundle-builder.ts', [
              (') as {\n    $id?: string;\n    properties: Record<string, Record<string, unknown>>;\n  };', ') as any;'),
          ])
          edit('backend/agents/researcher/workflow.ts', [
              ('    if (!provider) return sampleResearchDraft(prompt);',
               '    if (!provider) throw new Error("live Researcher requires a model provider");'),
          ])
          edit('backend/provider/adapter/openai.ts', [
              ('    compatibility: "strict",\n', ''),
          ])
          edit('backend/scripts/run-worker-cli.ts', [
              ('../../app/web/cloud/provider-manager.js', '../provider/manager.js'),
          ])

          # Remaining test imports that point at the deleted web-owned provider runtime.
          edit('backend/tests/ts/run-job-contract.test.ts', [
              ('../../../app/web/cloud/provider-manager.js', '../../provider/manager.js'),
              ('../../../app/web/cloud/provider-secret-store.js', '../../provider/secret-store.js'),
              ('../../../app/web/cloud/provider-runtime-config.js', '../../provider/runtime-config.js'),
          ])

          edit('backend/tests/ts/canonical-matrix.test.ts', [
              ('import type { ResearchProvider } from "../../../app/web/cloud/provider.js";',
               'import type { ModelProvider } from "../../provider/model-provider.js";'),
              ('const provider:ResearchProvider={async ready(){return {ready:true,provider:"test-provider-failure",models:[]};},async research(_p,_r){throw new WorkflowRootCauseError({issue:"provider",expected:"configured provider",actual:"provider failed",evidence_ids:[],required_correction:"configure provider",recheck_target:"provider"});}};',
               'const provider:ModelProvider={id:"test-provider-failure",model:"test-model",async ready(){return {ready:true,provider:"test-provider-failure",models:["test-model"]};},async generate(){throw new WorkflowRootCauseError({issue:"provider",expected:"configured provider",actual:"provider failed",evidence_ids:[],required_correction:"configure provider",recheck_target:"provider"});}};'),
          ])

          Path('backend/tests/ts/help-request.test.ts').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport type { ModelProvider } from "../../provider/model-provider.js";\nimport { WorkflowInformationRequiredError } from "../../core/information-required-error.js";\nimport { harness, prompt } from "./harness.js";\n\nclass NeedUserInfo implements ModelProvider {\n  readonly id = "test-need-user-info";\n  readonly model = "test-model";\n\n  async ready() {\n    return { ready: true, provider: this.id, models: [this.model] };\n  }\n\n  async generate(): Promise<string> {\n    throw new WorkflowInformationRequiredError(\n      {\n        issue: "Additional information required",\n        expected: "User-owned target environment is known",\n        actual: "Target environment was not supplied",\n        evidence_ids: [],\n        required_correction: "Ask user for target environment",\n        recheck_target: "run:need-help",\n      },\n      {\n        request_id: "help:test",\n        reason: "target environment missing",\n        question: "Which target environment should this run use?",\n        required_information: ["target_environment"],\n        source_processor: "Researcher",\n        prompt_revision_required: true,\n      },\n    );\n  }\n}\n\ntest("runtime ROOT CAUSE preserves targeted help request without recovery loop", async () => {\n  const h = await harness("need-help", new NeedUserInfo());\n  const runId = "run:need-help";\n  h.runs.create(runId);\n  const out = await h.runtime.run(runId, prompt(runId));\n  assert.equal(out.test_result, "Failed");\n  assert.equal(out.issue_type, "Root Cause");\n  assert.equal(out.help_request?.request_id, "help:test");\n  assert.equal(out.help_request?.source_processor, "Researcher");\n  assert.ok(\n    out.events.some(\n      (e) =>\n        e.scope === "SUPPORT" &&\n        e.processor === "HelpRequest" &&\n        e.test_result === "Failed" &&\n        e.issue_type === "Root Cause",\n    ),\n  );\n  assert.equal(\n    out.events.filter(\n      (e) => e.processor === "Researcher" && e.execution_status === "Running",\n    ).length,\n    1,\n  );\n  h.close();\n});\n''', encoding='utf-8')

          edit('backend/tests/ts/plan-review.test.ts', [
              ('import { FixtureResearchProvider } from "../../../app/web/cloud/provider/fixture-provider.js";\n', ''),
              ('  const dir = await mkdtemp(join(tmpdir(), "oneshot-review-"));\n  try {',
               '  const dir = await mkdtemp(join(tmpdir(), "oneshot-review-"));\n  const seed = await harness("review-unit-seed");\n  try {'),
              ('    const bundle = await new FixtureResearchProvider().research(prompt(\'review-unit\'), \'review-unit\');',
               '    const bundle = await seed.researcher.run(prompt("review-unit"), "review-unit");'),
              ('  } finally { await rm(dir, { recursive: true, force: true }); }',
               '  } finally { seed.close(); await rm(dir, { recursive: true, force: true }); }'),
          ])

          Path('backend/tests/ts/reconciled-deliverable.test.ts').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport { randomUUID } from "node:crypto";\nimport type { ModelProvider } from "../../provider/model-provider.js";\nimport type { ConfirmedPackage } from "../../contracts/schema/types.js";\nimport type { BuilderWorkflowResult } from "../../agents/builder/workflow.js";\nimport { HardenedProcessRunner } from "../../sandbox/runner/process-runner.js";\nimport { runBuildStage, type StageServices } from "../../pipeline/processors.js";\nimport { saveArtifact } from "../../pipeline/context.js";\nimport { harness, prompt } from "./harness.js";\n\ntest("model output survives Researcher construction, validation, sandbox execution and durable build artifacts", async () => {\n  const output = `Generated document ${randomUUID()} — preserve exact user-facing content.`;\n  const draft = JSON.parse(\n    await readFile("app/fixtures/provider/adk-research-draft.json", "utf8"),\n  );\n  draft.deliverable = output;\n  const provider: ModelProvider = {\n    id: "test-model",\n    model: "test-model",\n    ready: async () => ({\n      ready: true,\n      provider: "test-model",\n      models: ["test-model"],\n      detail: "Explicit deterministic model transport",\n    }),\n    generate: async () => JSON.stringify(draft),\n  };\n  const h = await harness(\n    `reconciled-output-${randomUUID()}`,\n    provider,\n    new HardenedProcessRunner(),\n  );\n  const runId = `output-${randomUUID()}`;\n  try {\n    h.runs.create(runId);\n    const snapshot = await h.runtime.run(runId, prompt(runId));\n    assert.equal(snapshot.test_result, "Passed");\n    assert.equal(snapshot.hash_proof?.equal, true);\n    const builder = await h.store.load<BuilderWorkflowResult>(runId, "builder-result");\n    assert.equal(builder.result, "Passed");\n    assert.equal(builder.final_output, output);\n    assert.ok(builder.output_step_id);\n    assert.equal(builder.evidence.exit_codes.at(-1), 0);\n\n    await h.store.save(runId, "hash_proof", snapshot.hash_proof);\n    const confirmedPkg = await h.store.load<ConfirmedPackage>(runId, "confirmed");\n    await h.runtime.buildReview.open(\n      runId,\n      confirmedPkg,\n      snapshot.hash_proof!.created_hash,\n    );\n    await h.runtime.buildReview.decide(runId, {\n      action: "approve",\n      hash: snapshot.hash_proof!.created_hash,\n    });\n    await runBuildStage(\n      { runId, runs: h.runs, store: h.store },\n      { builder: h.builder, events: { emit() {} }, saveArtifact, hash: h.hash } as unknown as StageServices,\n      () => {},\n    );\n    const queued = await h.store.load<BuilderWorkflowResult>(runId, "build_result");\n    assert.equal(queued.result, "Passed");\n    assert.equal(queued.final_output, output);\n    assert.equal(queued.hash_sandbox, snapshot.hash_proof?.created_hash);\n\n    const confirmed = await h.store.load<ConfirmedPackage>(runId, "confirmed");\n    confirmed.core.plan.steps.at(-1)!.description += "tamper";\n    const rejected = await h.builder.run(\n      confirmed,\n      snapshot.hash_proof!.created_hash,\n    );\n    assert.equal(rejected.result, "Failed");\n    assert.equal(rejected.final_output, null);\n    assert.equal(rejected.output_step_id, null);\n  } finally {\n    h.close();\n  }\n});\n''', encoding='utf-8')

          p = Path('backend/tests/ts/session-transcript-e2e.test.ts')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace(
              'import type { Prompt, ResearchBundle } from "../../contracts/schema/types.js";\nimport type {\n  ResearchProvider,\n  ResearchProviderReadiness,\n} from "../../../app/web/cloud/provider.js";\nimport type { ProcessingEventBus } from "../../runtime/event-bus.js";\nimport { FixtureResearchProvider } from "../../../app/web/cloud/provider/fixture-provider.js";\n',
              'import type { Prompt } from "../../contracts/schema/types.js";\n',
          )
          start = text.index('class CapturingResearchProvider')
          end = text.index('async function waitForTerminal')
          text = text[:start] + text[end:]
          text = text.replace(
              '  const provider = new CapturingResearchProvider(new FixtureResearchProvider());\n  const h = await harness("session-transcript-e2e", provider);',
              '  const h = await harness("session-transcript-e2e");',
          )
          old = '''    const final = await waitForTerminal(base, started.run_id);\n    assert.ok(provider.receivedPrompt, "Researcher did not receive Prompt(id)");\n    console.log(\n      `RESEARCHER_RECEIVED_PROMPT_JSON=${JSON.stringify(provider.receivedPrompt)}`,\n    );\n\n    const expectedRunPrompt = new PromptGenerator().generate(\n      conversation.intent,\n      started.prompt_id,\n    );\n    assert.deepEqual(provider.receivedPrompt, expectedRunPrompt);'''
          new = '''    const final = await waitForTerminal(base, started.run_id);\n    const expectedRunPrompt = new PromptGenerator().generate(\n      conversation.intent,\n      started.prompt_id,\n    );\n    const receivedPrompt = await h.store.load<Prompt>(started.run_id, "prompt");\n    const researcher = await h.store.load<any>(started.run_id, "researcher");\n    console.log(`RESEARCHER_RECEIVED_PROMPT_JSON=${JSON.stringify(receivedPrompt)}`);\n    assert.deepEqual(receivedPrompt, expectedRunPrompt);\n    assert.equal(researcher.prompt_id, expectedRunPrompt.prompt_id);'''
          if old not in text:
              raise SystemExit('session transcript assertion block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git add backend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete provider Researcher separation"
          git push origin HEAD:fix/provider-researcher-boundary

      - name: Use repository npm version
        run: npm install --global npm@11.8.0

      - name: Install dependencies
        run: npm ci

      - name: Backend TypeScript build
        run: npm run build:backend

      - name: Test TypeScript build
        run: npm run build:test

      - name: Provider and Researcher tests
        run: node --test --test-concurrency=1 --test-force-exit dist/backend/tests/ts/provider*.test.js dist/backend/tests/ts/adk-researcher-node.test.js dist/backend/tests/ts/help-request.test.js dist/backend/tests/ts/session-transcript-e2e.test.js

      - name: Pipeline E2E
        run: npm run test:pipeline:e2e

      - name: Boundary guard
        shell: bash
        run: |
          if grep -R "app/web/cloud/provider" backend --include='*.ts' --exclude-dir=tests; then
            echo "backend still depends on app/web provider runtime" >&2
            exit 1
          fi
          if grep -R "ResearchProvider" backend --include='*.ts' --exclude-dir=tests; then
            echo "legacy ResearchProvider contract remains in backend runtime" >&2
            exit 1
          fi
          for f in backend/provider/adapter/*.ts backend/provider/model-provider.ts; do
            if grep -E "ResearchBundle|fixture_id|goal_id|schema_artifact|Researcher" "$f"; then
              echo "provider transport leaked Researcher/domain ownership: $f" >&2
              exit 1
            fi
          done
          git diff --check HEAD~1 HEAD

      - name: Mark plan complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/work/provider-researcher-boundary.md')
          text = p.read_text()
          text = text.replace('Status: APPROVED', 'Status: COMPLETE')
          text = text.replace(
            'APPROVED — implementation authorized by user on 2026-09-10.',
            'COMPLETE — provider transport and Researcher role boundaries separated and verified on 2026-09-10.',
          )
          p.write_text(text)
          PY
          git add docs/work/provider-researcher-boundary.md
          git commit -m "docs: close provider boundary migration"
          git push origin HEAD:fix/provider-researcher-boundary
