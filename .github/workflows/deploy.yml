name: OneShot CI & GitHub Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping intermediate runs
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Job 1: Test & Verify Backend and Runtime
  verify-backend:
    name: Verify Backend & Agent Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.1
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Agent Runtime
        run: pnpm exec tsc -p packages/agent-runtime/tsconfig.json --noEmit

      - name: Run Backend & Runtime Tests
        run: pnpm run test:runtime

  # Job 2: Test & Build Frontend
  build-and-test-frontend:
    name: Verify Frontend & Build Static Export
    runs-on: ubuntu-latest
    needs: verify-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.1
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        working-directory: frontend/web
        run: pnpm run typecheck

      - name: Run Frontend Contract Tests
        working-directory: frontend/web
        run: pnpm test

      - name: Build Next.js Static Export
        working-directory: frontend/web
        run: pnpm run build

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

      - name: Archive Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneshot-web-dist
          path: frontend/web/dist
          retention-days: 14

  # Job 3: Deploy to GitHub Pages (only from the default branch)
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
