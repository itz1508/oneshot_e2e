name: ADK v2 Verify

on:
  push:
    branches: [adk-workflow-v2]
  pull_request:
    branches: [adk-workflow-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adk-v2-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.13.0
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/web/package-lock.json

      - name: Set up npm 11.8.0
        run: npm install --global npm@11.8.0 --no-audit --no-fund

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install root dependencies (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies (npm ci)
        run: npm --prefix app/web ci --no-audit --no-fund

      - name: Install Python core dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements/base.txt

      - name: Install Python workspace API dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements/workspace-api.txt

      - name: Verify OneShot (canonical repository verification)
        run: npm run verify

      - name: Web test gate
        run: npm --prefix app/web test

      - name: Verification must not mutate tracked files
        run: git diff --exit-code
