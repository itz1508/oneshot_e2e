name: ADK v2 Verify

on:
  push:
    branches: [adk-workflow-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root dependencies and refresh lock
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Python core dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build backend
        run: npm run build:backend

      - name: Run Python validation tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run compiled TypeScript tests
        run: node --test dist/tests_ts/*.test.js

      - name: Verify canonical contracts
        run: npm run verify
