name: OneShot ADK v2 Verification

on:
  push:
    branches:
      - adk-workflow-v2
  pull_request:
    branches:
      - adk-workflow-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adk-v2-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-workspace-api.txt

      - name: Set up npm 11.8.0
        run: npm install --global npm@11.8.0 --no-audit --no-fund

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          python --version

      - name: Install root dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies from lockfile
        run: npm --prefix web ci --no-audit --no-fund

      - name: Install Python dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r requirements.txt
          -r requirements-workspace-api.txt

      - name: Run canonical OneShot verification
        run: npm run verify

      - name: Run web tests
        run: npm --prefix web test

      - name: Assert verification did not mutate tracked files
        run: git diff --exit-code
