name: Temporary Role Pipeline Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-role-pipeline-test.yml'

permissions:
  contents: read

jobs:
  role-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up npm 11.8
        run: npm install --global npm@11.8.0 --no-audit --no-fund

      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build backend and tests
        run: npm run build:backend

      - name: Run role pipeline test
        run: node --test --test-force-exit dist/tests_ts/role-pipeline.test.js
